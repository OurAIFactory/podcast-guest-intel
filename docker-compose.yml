services:
  web:
    build: .
    ports: ["8080:8080"]
    environment:
      - DEPLOY_MODE=local
      - PORT=8080
      - APP_DATA_DIR=/app/data
    volumes:
      - appdata:/app/data
    restart: unless-stopped
  collector:
    build: .
    command: ["node","--experimental-sqlite","src/collector.js"]
    environment:
      - DEPLOY_MODE=local
      - APP_DATA_DIR=/app/data
      - COLLECTOR_CONCURRENCY=24
    volumes:
      - appdata:/app/data
    restart: unless-stopped
volumes:
  appdata:
